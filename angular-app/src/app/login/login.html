<div class="login-page">

  <div class="login-box">

    <div class="login-header">

      <h1>ClassTrack</h1>

      <p>Tuition Management System</p>

    </div>

    <div class="login-form">

      <h2>Welcome Back</h2>

      <p class="login-message">
        Sign in to continue
      </p>

      <div class="form-group">

        <label>Username</label>

        <input
          type="text"
          [(ngModel)]="username"
          placeholder="Enter username">

      </div>

      <div class="form-group">

        <label>Password</label>

        <input
          type="password"
          [(ngModel)]="password"
          placeholder="Enter password">

      </div>

      <button
        type="button"
        class="login-button"
        (click)="login()">

        Login

      </button>

    </div>

    <div class="login-footer">

      ClassTrack Tuition Management System

    </div>

  </div>

</div>
