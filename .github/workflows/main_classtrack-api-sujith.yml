# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy ASP.Net Core app to Azure Web App - classtrack-api-sujith

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: angular-app/package-lock.json

      - name: Install Angular dependencies
        run: npm ci --prefix angular-app

      - name: Run Angular unit tests
        run: npm run test --prefix angular-app -- --watch=false --isolate=false

      - name: Build Angular for production
        run: npm run build --prefix angular-app -- --configuration production

      - name: Include Angular app in API package
        shell: pwsh
        run: |
          $webRoot = "ClassTrack.API/ClassTrack.API/wwwroot"
          New-Item -ItemType Directory -Path $webRoot -Force | Out-Null
          Copy-Item -Path "angular-app/dist/angular-app/browser/*" -Destination $webRoot -Recurse -Force

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'

      - name: Build with dotnet
        run: dotnet build ClassTrack.API/ClassTrack.API/ClassTrack.API.csproj --configuration Release

      - name: dotnet publish
        run: dotnet publish ClassTrack.API/ClassTrack.API/ClassTrack.API.csproj -c Release -o "${{env.DOTNET_ROOT}}/myapp"

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: .net-app
          path: ${{env.DOTNET_ROOT}}/myapp

  deploy:
    runs-on: windows-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: .net-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_D48733206400491FB7B4DDA1CFDA9414 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_0ECBA1718C7946B39C8A660E6E10E819 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_4A7AEB468041438394DCCE01473F9E4E }}

      - name: Verify required App Service settings
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $resourceGroup = az webapp list --query "[?name=='classtrack-api-sujith'] | [0].resourceGroup" -o tsv
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($resourceGroup)) {
            throw "Unable to locate the Azure Web App resource group."
          }

          $settingsJson = az webapp config appsettings list --name "classtrack-api-sujith" --resource-group $resourceGroup -o json
          if ($LASTEXITCODE -ne 0) {
            throw "Unable to read the Azure Web App settings."
          }
          $settings = $settingsJson | ConvertFrom-Json
          Write-Host "Configured App Service setting names (values hidden):"
          $settings | ForEach-Object { Write-Host "  $($_.name)" }
          foreach ($name in @("Jwt__Key", "Jwt__Issuer", "Jwt__Audience")) {
            $setting = $settings | Where-Object { $_.name -eq $name } | Select-Object -First 1
            if ($null -eq $setting -or [string]::IsNullOrWhiteSpace($setting.value)) {
              throw "Required Azure Web App setting is missing: $name"
            }
          }

          $connectionStringSetting = $settings | Where-Object { $_.name -eq "ConnectionStrings__DefaultConnection" } | Select-Object -First 1
          if ($null -eq $connectionStringSetting -or [string]::IsNullOrWhiteSpace($connectionStringSetting.value)) {
            $connectionStringsJson = az webapp config connection-string list --name "classtrack-api-sujith" --resource-group $resourceGroup -o json
            if ($LASTEXITCODE -ne 0) {
              throw "Unable to read Azure Web App connection-string names."
            }
            $connectionStrings = $connectionStringsJson | ConvertFrom-Json
            Write-Host "Configured App Service connection-string names and types (values hidden):"
            $connectionStrings | ForEach-Object { Write-Host "  $($_.name) ($($_.type))" }
            $connectionString = $connectionStrings | Where-Object { $_.name -eq "DefaultConnection" } | Select-Object -First 1
            if ($null -eq $connectionString -or [string]::IsNullOrWhiteSpace($connectionString.value)) {
              $identityJson = az webapp identity show --name "classtrack-api-sujith" --resource-group $resourceGroup -o json 2>$null
              $identity = if ($LASTEXITCODE -eq 0 -and $identityJson) { $identityJson | ConvertFrom-Json } else { $null }
              $sqlServersJson = az sql server list --query "[].{name:name,resourceGroup:resourceGroup}" -o json 2>$null
              $sqlServers = if ($LASTEXITCODE -eq 0 -and $sqlServersJson) { $sqlServersJson | ConvertFrom-Json } else { @() }

              Write-Host "App Service system-assigned identity enabled: $([bool]($identity -and $identity.principalId))"
              if ($sqlServers.Count -eq 0) {
                Write-Host "Azure SQL servers visible to this deployment identity: none"
              } else {
                Write-Host "Azure SQL servers visible to this deployment identity:"
                foreach ($server in $sqlServers) {
                  Write-Host "  $($server.name) (resource group: $($server.resourceGroup))"
                  $databasesJson = az sql db list --server $server.name --resource-group $server.resourceGroup --query "[].name" -o json 2>$null
                  if ($LASTEXITCODE -eq 0 -and $databasesJson) {
                    $databases = $databasesJson | ConvertFrom-Json
                    foreach ($database in $databases) {
                      Write-Host "    database: $database"
                    }
                  }
                  $adminsJson = az sql server ad-admin list --server $server.name --resource-group $server.resourceGroup -o json 2>$null
                  if ($LASTEXITCODE -eq 0 -and $adminsJson) {
                    $admins = $adminsJson | ConvertFrom-Json
                    Write-Host "    Microsoft Entra SQL administrator configured: $([bool]$admins.Count)"
                  }
                }
              }

              throw "Azure SQL connection string is missing. See the resource and identity inventory above; add DefaultConnection or configure SQL access for the App Service identity."
            }
          }

          $jwtKey = ($settings | Where-Object { $_.name -eq "Jwt__Key" } | Select-Object -First 1).value
          if ([Text.Encoding]::UTF8.GetByteCount($jwtKey) -lt 32) {
            throw "Jwt__Key must contain at least 32 bytes."
          }

          az webapp config appsettings set `
            --name "classtrack-api-sujith" `
            --resource-group $resourceGroup `
            --settings "Database__ApplyMigrations=false" `
            --output none
          if ($LASTEXITCODE -ne 0) {
            throw "Unable to disable automatic startup migrations."
          }

          az webapp log config `
            --name "classtrack-api-sujith" `
            --resource-group $resourceGroup `
            --application-logging filesystem `
            --level error `
            --output none
          if ($LASTEXITCODE -ne 0) {
            throw "Unable to enable App Service error logging."
          }

          "resourceGroup=$resourceGroup" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'classtrack-api-sujith'
          slot-name: 'Production'
          package: .

      - name: Verify deployed app and database connectivity
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $baseUrl = "https://classtrack-api-sujith-hxfte0dqhbcmd3dj.centralindia-01.azurewebsites.net"
          $app = Invoke-WebRequest -Uri $baseUrl -TimeoutSec 60
          if ($app.StatusCode -ne 200 -or $app.Content -notmatch "<app-root") {
            throw "The deployed Angular application did not return its entry page."
          }

          $swagger = Invoke-WebRequest -Uri "$baseUrl/swagger/index.html" -TimeoutSec 30
          if ($swagger.StatusCode -ne 200) {
            throw "The deployed API Swagger page is unavailable."
          }

          $probe = @{
            username = "__deployment_probe_$([Guid]::NewGuid().ToString('N'))"
            password = [Guid]::NewGuid().ToString('N')
          } | ConvertTo-Json -Compress
          try {
            $response = Invoke-WebRequest -Uri "$baseUrl/api/Auth/login" -Method Post -ContentType "application/json" -Body $probe -TimeoutSec 30
            $statusCode = [int]$response.StatusCode
          } catch {
            $statusCode = [int]$_.Exception.Response.StatusCode
          }
          if ($statusCode -ne 401) {
            throw "The database-backed login probe returned HTTP $statusCode instead of 401."
          }

      - name: Capture redacted App Service error logs
        if: failure()
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          $logs = az webapp log tail `
            --name "classtrack-api-sujith" `
            --resource-group $env:resourceGroup `
            --provider application `
            --timeout 20 2>&1 | Out-String
          $logs = $logs -replace '(?i)(password|pwd)\s*=\s*[^;\s]+', '$1=[REDACTED]'
          $logs = $logs -replace '(?i)(user\s*id|uid)\s*=\s*[^;\s]+', '$1=[REDACTED]'
          $logs = $logs -replace '(?i)(accountkey|sharedaccesssignature)\s*=\s*[^;\s]+', '$1=[REDACTED]'
          $lines = $logs -split "`r?`n" | Where-Object {
            $_ -match '(?i)exception|sql|database|login failed|invalid object|cannot open|timeout|error'
          } | Select-Object -Last 40
          if ($lines) {
            $lines | ForEach-Object { Write-Host $_ }
          } else {
            Write-Host "No matching App Service error log entries were available."
          }
